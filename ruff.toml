# ScriptSentry lint gate.
#
# Deliberately minimal: this is a correctness floor (pyflakes + pycodestyle
# errors), not a style enforcement. The rule set is pinned explicitly so a
# new ruff release cannot silently move the gate. Widen it gradually — good
# next candidates: "B" (bugbear), "SIM", then per-file ignores where the
# stdlib-server code needs broad excepts.
target-version = "py310"
line-length = 120
extend-exclude = ["webui", "output"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests legitimately keep imports at module scope for patching/inspection.
"tests/*" = ["F401"]
