[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptsentry"
description = "Inventory and analyze the JavaScript a website actually ships — local-only static analysis with a web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ScriptSentry contributors" }]
keywords = ["javascript", "security", "static-analysis", "taint-analysis", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "colorama",
    "tqdm",
    "jsbeautifier",
    "tree-sitter",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "esprima",
    "playwright",
]
dynamic = ["version"]

[project.optional-dependencies]
# Runtime browser evidence (dynamic analysis) needs a Chromium binary:
#   pip install "scriptsentry[runtime]" && playwright install chromium
runtime = ["playwright"]

[project.scripts]
scriptsentry = "main:main"
scriptsentry-server = "server:main"

[project.urls]
Homepage = "https://amitpal-cyberbuddy.github.io/ScriptSentry/"

[tool.setuptools]
# api/ was missing here once: the wheel installed but `scriptsentry-server`
# died on ``from api import …``. Keep every runtime package in the list.
packages = { find = { include = ["ai*", "analyzers*", "api*", "core*"] } }
py-modules = ["main", "server", "config", "scriptsentry"]

[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }

[tool.setuptools.data-files]
# The dashboard is served from these directories; ship the runtime files
# with the wheel. IMPORTANT: setuptools data-files does NOT preserve source
# subdirectories — every source file is installed directly into the
# destination directory, so each subdirectory gets its own destination key.
# Listing everything under one key silently collapses `webui/home/index.html`
# (and /tool/, /changelog/) into the top-level index.html — the last one wins
# and an installed server serves the changelog at "/".
# tests/test_release_metadata.py guards this mapping; keep it in sync.
"share/scriptsentry/webui" = [
    "webui/app.js",
    "webui/styles.css",
    "webui/config.js",
    "webui/index.html",
    "webui/404.html",
]
"share/scriptsentry/webui/home" = [
    "webui/home/index.html",
]
"share/scriptsentry/webui/tool" = [
    "webui/tool/index.html",
]
"share/scriptsentry/webui/changelog" = [
    "webui/changelog/index.html",
]
"share/scriptsentry/webui/assets" = [
    "webui/assets/favicon.svg",
    "webui/assets/favicon-32.png",
    "webui/assets/apple-touch-icon.png",
    "webui/assets/icon-192.png",
    "webui/assets/icon-512.png",
    "webui/assets/og-card.png",
    "webui/assets/site.webmanifest",
]

[tool.coverage.run]
source = ["ai", "analyzers", "api", "core", "config", "main", "server"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
