name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main, arena/01a0450f-scriptsentry]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare static dashboard site
        run: |
          set -euxo pipefail
          mkdir -p _site
          cp -r webui/* _site/
          # Optional: enable the hosted backend URL here.
          # sed -i 's#window.SCRIPTSENTRY_API = "";#window.SCRIPTSENTRY_API = "https://your-backend.example.com";#' _site/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
