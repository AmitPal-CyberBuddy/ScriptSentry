<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · ScriptSentry</title>
  <meta name="robots" content="noindex" />
  <style>
    /* Self-contained (the 404 must render even if styles.css is the
       thing that 404'd). Tokens mirror webui/styles.css. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #04070d;
      color: #e8eefb;
    }
    main {
      max-width: 34rem;
      margin: 3rem 1.5rem;
    }
    .plate {
      border: 1px solid rgba(146, 180, 232, 0.14);
      border-radius: 14px;
      background: #0b1220;
      padding: 2rem;
    }
    .code {
      display: block;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(146, 180, 232, 0.45);
    }
    .kicker {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #22d3ee;
    }
    h1 { margin: 0.6rem 0 0.6rem; font-size: 1.4rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.5rem; line-height: 1.6; color: #93a5c4; font-size: 0.95rem; }
    nav { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.65rem 1.1rem;
      border: 1px solid rgba(146, 180, 232, 0.22);
      border-radius: 8px;
      background: transparent;
      color: #e8eefb;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    a:hover { border-color: rgba(34, 211, 238, 0.55); color: #22d3ee; }
    a.primary { background: #22d3ee; border-color: #22d3ee; color: #04222a; }
    a.primary:hover { background: #67e3f4; color: #04222a; }
  </style>
</head>
<body>
  <main>
    <div class="plate">
      <span class="kicker">Error</span>
      <span class="code">404</span>
      <h1>Nothing is posted at this address</h1>
      <p>The analyzer, the overview and the changelog all live one click away.</p>
      <nav id="nav-404">
        <a class="primary" href="tool/">⚡ Open the analyzer</a>
        <a href="home/">Overview</a>
        <a href="changelog/">What's new</a>
      </nav>
    </div>
  </main>

  <script>
    // The site lives at / under server.py but at /<project>/ on GitHub
    // Pages, so the recovery links are rewritten at runtime from the
    // current path instead of hardcoding a site root.
    (function () {
      var segments = window.location.pathname.replace(/\/$/, "").split("/");
      segments.pop();                      // the missing page itself
      var root = segments.join("/") + "/";
      if (root === "/") return;            // served at the site root already
      document.querySelectorAll("#nav-404 a").forEach(function (a) {
        a.setAttribute("href", root + a.getAttribute("href"));
      });
    })();
  </script>
</body>
</html>
