# GitHub Pages workflow template for ScriptSentry.
#
# GitHub's hosted runners will not allow a GitHub App without `workflows`
# permission to create or update files under `.github/workflows/`. To use this
# workflow, copy this file to `.github/workflows/deploy-pages.yml` in your repo
# (or the platform used to manage the repo), then enable:
#   Settings → Pages → Source → GitHub Actions
#
# Alternatively, push this file manually with a token that has `workflows`
# scope (e.g. `gh auth login` with scopes including workflows).

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Prepare static dashboard site
        run: |
          set -euxo pipefail
          mkdir -p _site
          cp -a webui/. _site/
          # Keep this workflow safe if it is copied into an older checkout that
          # still has root-absolute asset references. Relative paths are required
          # for project Pages URLs such as /ScriptSentry/.
          sed -i \
            -e 's#href="/styles.css"#href="styles.css"#g' \
            -e 's#src="/config.js"#src="config.js"#g' \
            -e 's#src="/app.js"#src="app.js"#g' \
            _site/index.html
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/config.js
          test -s _site/app.js
          touch _site/.nojekyll
          # Optional: enable a hosted backend URL here, never commit a token.
          # sed -i 's#window.SCRIPTSENTRY_API = "";#window.SCRIPTSENTRY_API = "https://your-backend.example.com";#' _site/config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
